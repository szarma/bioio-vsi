[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bioio-vsi"
description = "JVM-free reader for Olympus/Evident cellSens VSI microscopy images"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Srdjan Sarikas" }]
dynamic = ["version"]
dependencies = [
    "bioio-base",
    "numpy",
]

[project.optional-dependencies]
codecs = ["imagecodecs"]
dev = [
    "imagecodecs",
    "mypy",
    "pytest",
    "ruff",
    "slideio",
]
test = [
    "pytest",
    "mypy",
    "ruff",
    "slideio",
    "bioio>=3.5.1",
]

[project.urls]
Homepage = "https://github.com/szarma/bioio-vsi"
Issues = "https://github.com/szarma/bioio-vsi/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bioio_vsi*"]
# Tests and their sample files stay in the sdist only.
exclude = ["bioio_vsi.tests*"]

[tool.setuptools.exclude-package-data]
bioio_vsi = ["tests/**"]

[project.entry-points."bioio.readers"]
bioio-vsi = "bioio_vsi"

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["imagecodecs.*", "slideio.*", "bioio.*", "bioio_base.*", "dask.*", "fsspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["bioio_vsi/tests"]
